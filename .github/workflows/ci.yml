name: Fullstack CI (with Docker)

on:
  push:
    branches: [main]
#  pull_request:
#    branches: [ main ]
# 💡 Dockerfileの変更時にもCIが走るように対象を追加
#    paths:
#      - 'backend/**'
#      - 'frontend/**'
#      - 'docker-compose.yml'
#  workflow_dispatch:

jobs:
  # --- Docker環境でバックエンドとフロントエンドをまとめてテスト ---
  docker-fullstack-ci:
    runs-on: ubuntu-latest
    steps:
      # 1. コードのチェックアウト
      - uses: actions/checkout@v4

      # 2. Docker環境のセットアップ（ビルドの高速化に必要）
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Docker Compose を使って全コンテナをビルド＆起動
      # 💡 これにより、ローカルと全く同じDockerfile、同じ手順（sleep、型同期）で検証が走ります
      - name: Build and Start Containers
        env:
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
        run: |
          echo "MYSQL_DATABASE=${MYSQL_DATABASE}" >> .env
          echo "MYSQL_USER=${MYSQL_USER}" >> .env
          echo "MYSQL_PASSWORD=${MYSQL_PASSWORD}" >> .env
          echo "MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}" >> .env
          touch frontend/.env.local
          chmod +x backend/gradlew
          docker compose up --build -d

      - name: Wait for Database Initialization
        run: |
          echo "Waiting 25 seconds for MySQL to be fully ready..."
          sleep 25

      - name: Wait for backend to be ready
        run: |
          for i in {1..30}; do
            if [ "$(docker compose ps --format json | grep '"Service":"backend"' | grep '"State":"running"')" ]; then
              echo "Backend is running!"
              exit 0
            fi
            echo "Waiting for backend..."
            sleep 1
          done
          echo "Backend failed to start"
          exit 1
      - name: Debug Docker Status and Logs
        if: always() # 30秒待機がエラーで終わっても、必ずこのステップを実行する設定
        run: |
          echo "=== Container Status ==="
          docker compose ps
          echo "=== Backend Container Logs ==="
          docker compose logs backend

      # 4. バックエンドの動作確認（必要に応じて追加）
      # ※もしテストコードを走らせたい場合は、コンテナ内で実行させます
      #      - name: Run Backend Tests inside Container
      #        run: |
      #          docker compose exec -T backend ./gradlew test

      # 5. フロントエンドの検証（型同期やビルドが成功して、コンテナが生きているか確認）

      - name: Run Frontend Tests
        run: docker compose exec -T frontend npm run test

      - name: Check Frontend Container Status
        run: |
          if [ "$(docker inspect -f '{{.State.Running}}' my_frontend)" != "true" ]; then
            echo "Frontend container is not running!"
            docker compose logs frontend
            exit 1
          fi

      # 1. フロントエンドのテストが終わった後、一度コンテナをすべて落としてメモリを完全クリア
      - name: Down Docker Compose
        run: docker compose down

      # 2. データベース（db）コンテナだけを起動する（バックエンドコンテナは起動しない！）
      - name: Start Database Only
        run: docker compose up -d db

      # 3. GitHub Actions（ホスト側）に Java をセットアップする
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21" # ※お使いのJavaバージョン（17や21など）に合わせてください
          distribution: "temurin"
          cache: "gradle" # Gradleの依存関係をキャッシュして2回目以降を爆速にする

      # 4. ホスト側で直接テストを実行する（Dockerの無駄なメモリを一切消費しない）
      - name: Run Backend Tests on Host
        env:
          # ホスト側の潤沢なメモリを最大3GBまで贅沢に割り当てる
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g"
        run: |
          cd backend
          ./gradlew test

      # 6. 後片付け
      - name: Stop Containers
        if: always() # 途中でエラーが起きても必ず実行する
        run: docker compose down
